; Bastion presence firmware for GeekMagic SmallTV boards.
;   pio run -e ultra    GeekMagic SmallTV Ultra (ESP8266, no touch)
;   pio run -e pro      GeekMagic SmallTV Pro   (ESP32, capacitive touch)

[platformio]
default_envs = ultra, pro

[common]
framework = arduino
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@7.2.0
    ricmoo/QRCode@0.0.1
; TFT_eSPI is configured entirely from build flags (no User_Setup.h).
; The per-board pins (TFT_MOSI, TFT_SCLK, TFT_DC, TFT_RST, backlight, touch)
; come from src/boards/<board>.h, force-included below so that the library
; and the firmware see the same values.
build_flags =
    -Isrc
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_CS=-1
    -DTFT_MISO=-1
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_ON=1
    -DTFT_SPI_MODE=SPI_MODE3
    -DSPI_FREQUENCY=40000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    ; SMOOTH_FONT intentionally not defined (RAM)

[env:ultra]
platform = espressif8266@4.2.1
board = esp12e
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld
board_build.flash_mode = dout
board_build.f_cpu = 160000000L
lib_deps = ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -include boards/ultra.h

[env:pro]
platform = espressif32@6.9.0
board = esp32dev
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -DUSE_HSPI_PORT=1
    -include boards/pro.h
